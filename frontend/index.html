<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Energy Dashboard - Login</title>
    <meta name="description" content="Login to Solar Panel Energy Monitoring Dashboard">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="auth-container">
        <!-- Left Branding Panel -->
        <div class="auth-branding">
            <div class="brand-content">
                <div class="brand-icon">
                    <i class="fas fa-solar-panel"></i>
                </div>
                <h1>Solar Energy Monitor</h1>
                <p>Real-time monitoring and analytics for your solar panel systems. Track power, current, voltage, and temperature — all in one place.</p>
                <div class="brand-features">
                    <div class="feature">
                        <i class="fas fa-chart-line"></i>
                        <span>Live Analytics</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-bolt"></i>
                        <span>Real-time Data</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-download"></i>
                        <span>CSV Export</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Auth Panel -->
        <div class="auth-panel">
            <div class="auth-card">
                <!-- Tab Toggle -->
                <div class="auth-tabs">
                    <button class="tab-btn active" id="login-tab" onclick="switchTab('login')">Sign In</button>
                    <button class="tab-btn" id="signup-tab" onclick="switchTab('signup')">Sign Up</button>
                    <div class="tab-indicator" id="tab-indicator"></div>
                </div>

                <!-- Error / Success Messages -->
                <div id="auth-message" class="auth-message hidden"></div>

                <!-- Login Form -->
                <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-email"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="login-email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password"><i class="fas fa-lock"></i> Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="login-password" placeholder="Enter your password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('login-password', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit" id="login-btn">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-loader hidden"><i class="fas fa-spinner fa-spin"></i></span>
                    </button>
                </form>

                <!-- Signup Form -->
                <form id="signup-form" class="auth-form hidden" onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label for="signup-name"><i class="fas fa-user"></i> Full Name</label>
                        <input type="text" id="signup-name" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-email"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="signup-email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-password"><i class="fas fa-lock"></i> Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="signup-password" placeholder="Min 6 characters" required minlength="6">
                            <button type="button" class="toggle-password" onclick="togglePassword('signup-password', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit" id="signup-btn">
                        <span class="btn-text">Create Account</span>
                        <span class="btn-loader hidden"><i class="fas fa-spinner fa-spin"></i></span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
